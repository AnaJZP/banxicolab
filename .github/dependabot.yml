# GitHub revisa cada semana si hay versiones nuevas de las acciones que usan los
# flujos y de las dependencias de Python, y abre una propuesta de actualización.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Acciones"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependencias"
