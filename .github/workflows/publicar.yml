name: Publicar en PyPI

# Se ejecuta al subir una etiqueta de versión (por ejemplo v0.3.0). No usa
# contraseñas ni tokens: PyPI confía en este flujo por «Trusted Publishing»,
# dado de alta en https://pypi.org/manage/account/publishing/ con el entorno «pypi».
on:
  push:
    tags: ["v*"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
