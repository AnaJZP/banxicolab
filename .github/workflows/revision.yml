name: Revisión semanal contra Banxico

# Cada lunes comprueba que los alias del catálogo siguen existiendo en el SIE y,
# si el repositorio tiene el secreto BANXICO_TOKEN_PRUEBA, que la descarga real
# funciona. Si algo falla, GitHub avisa por correo.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Catálogo público (sin token)
        run: pytest -m red
      - name: Descarga real (requiere el secreto BANXICO_TOKEN_PRUEBA)
        env:
          BANXICO_TOKEN_PRUEBA: ${{ secrets.BANXICO_TOKEN_PRUEBA }}
        run: pytest -m token
