name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

# El token de GitHub de este flujo solo puede leer el repositorio
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Sin red ni token: las pruebas usan respuestas simuladas del SIE
      - run: pytest

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e . bandit pip-audit
      # Análisis estático del código en busca de patrones inseguros
      - run: bandit -q -r src
      # Vulnerabilidades conocidas en las dependencias que se instalan con la librería
      - run: pip-audit --skip-editable
