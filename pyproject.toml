[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banxicolab"
dynamic = ["version"]
description = "Cliente no oficial en Python para la API del SIE de Banco de México: descarga de series y transformaciones para análisis económico."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ana Lorena Jiménez Preciado" }]  # ESE - IPN
keywords = ["banxico", "sie", "inflacion", "series de tiempo", "economia", "mexico"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "pandas>=2.2",
    "numpy>=1.24",
    "statsmodels>=0.14",  # desestacionalización, prueba ADF y pronósticos
    "matplotlib>=3.7",  # gráficas de los ejemplos
]

[project.optional-dependencies]
# Se conserva vacío para que `pip install "banxicolab[analisis]"`, la forma de
# instalar hasta la 0.3.1, siga funcionando.
analisis = []
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Repositorio = "https://github.com/AnaJZP/banxicolab"
Documentacion = "https://anajzp.github.io/banxicolab/"
Problemas = "https://github.com/AnaJZP/banxicolab/issues"

[project.scripts]
banxicolab = "banxicolab.cli:main"

[tool.hatch.version]
path = "src/banxicolab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/banxicolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "red: pruebas que consultan el catálogo público de Banxico (sin token)",
    "token: pruebas que requieren un token real en BANXICO_TOKEN",
]
addopts = "-m 'not red and not token'"

[tool.ruff]
line-length = 100
src = ["src"]
# Los notebooks son material de clase: ruff no debe reformatearlos
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
